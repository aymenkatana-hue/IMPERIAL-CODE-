<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Imperial Code - Maison Oudora</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

<style>

/* =========================
   GLOBAL
========================= */

html, body {
    margin: 0;
    padding: 0;
    background: #050507;
    overflow-x: hidden;
}

body {
    font-family: 'Playfair Display', serif;
    color: #e8e6e3;
    line-height: 1.6;

    background:
        radial-gradient(circle at top,
        rgba(201,168,106,0.08),
        transparent 50%),

        radial-gradient(circle at bottom,
        rgba(80,60,20,0.15),
        transparent 60%),

        linear-gradient(180deg, #050507, #000);
}

/* =========================
   LUXURY GLOW
========================= */

body::before {
    content: "";
    position: fixed;
    top: 50%;
    left: 50%;
    width: 350px;
    height: 350px;
    transform: translate(-50%, -50%);
    background:
        radial-gradient(circle,
        rgba(201,168,106,0.10),
        transparent 70%);
    filter: blur(20px);
    z-index: 0;
    pointer-events: none;
}

/* =========================
   CONTAINER
========================= */

.container {
    position: relative;
    z-index: 2;
    max-width: 900px;
    margin: auto;
    padding: 60px 20px;
}

/* =========================
   LOGO
========================= */

.logo {
    text-align: center;
}

.logo img {
    width: 120px;
    filter: drop-shadow(0 0 12px rgba(201,168,106,0.45));
}

/* =========================
   TITLE
========================= */

.title {
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: 40px;
    letter-spacing: 6px;
    margin-top: 18px;

    text-shadow:
        0 0 12px rgba(201,168,106,0.25);
}

/* =========================
   PERFUME IMAGE
========================= */

.hero-image {
    text-align: center;
    margin: 30px 0;
}

.hero-image img {
    width: 230px;
    max-width: 80%;
    height: auto;
    display: block;
    margin: auto;

    border-radius: 16px;

    box-shadow:
        0 0 35px rgba(201,168,106,0.18);

    transition: 0.4s ease;
}

.hero-image img:hover {
    transform: scale(1.03);
}

/* =========================
   SUBTITLE
========================= */

.subtitle {
    text-align: center;
    opacity: 0.82;
    font-size: 16px;
    letter-spacing: 2px;
}

/* =========================
   QUOTE
========================= */

.quote {
    text-align: center;
    margin: 28px 0;
    font-style: italic;
    opacity: 0.88;
    font-size: 15px;
}

/* =========================
   SECTION
========================= */

.section {
    margin-top: 45px;
}

/* =========================
   INDEX BOX
========================= */

.index-box {
    background: rgba(255,255,255,0.03);

    padding: 24px;

    border-radius: 16px;

    border:
        1px solid rgba(201,168,106,0.22);

    backdrop-filter: blur(10px);
}

/* =========================
   STAMP
========================= */

.stamp {
    text-align: center;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(201,168,106,0.8);
    margin-bottom: 22px;
}

/* =========================
   STATS
========================= */

.stat {
    margin-bottom: 18px;
}

.label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
}

/* =========================
   BARS
========================= */

.bar {
    height: 6px;
    background: rgba(255,255,255,0.06);
    border-radius: 50px;
    overflow: hidden;
}

.bar-fill {
    height: 100%;
    border-radius: 50px;

    background:
        linear-gradient(
            90deg,
            #c9a86a,
            #f5e6b0
        );
}

/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;
    margin-top: 60px;
    font-size: 12px;
    opacity: 0.6;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .container {
        padding: 40px 18px;
    }

    .title {
        font-size: 28px;
        letter-spacing: 4px;
    }

    .hero-image img {
        width: 190px;
    }

    body::before {
        width: 220px;
        height: 220px;
        filter: blur(14px);
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->
    <div class="logo">
        <img src="logo.png" alt="Maison Oudora">
    </div>

    <!-- TITLE -->
    <div class="title">
        IMPERIAL CODE
    </div>

    <!-- PERFUME -->
    <div class="hero-image">
        <img src="perfume.png" alt="Imperial Code Perfume">
    </div>

    <!-- SUBTITLE -->
    <div class="subtitle">
        الشفرة الإمبراطورية
    </div>

    <!-- QUOTE -->
    <div class="quote">
        "ليست كل الشفرات تُفك... بعضها يُرتدى."
    </div>

    <!-- INDEX -->
    <div class="section">

        <div class="index-box">

            <div class="stamp">
                CERTIFIED • MAISON OUDORA
            </div>

            <div class="stat">
                <div class="label">
                    <span>Presence</span>
                    <span>9.7</span>
                </div>

                <div class="bar">
                    <div class="bar-fill" style="width:97%"></div>
                </div>
            </div>

            <div class="stat">
                <div class="label">
                    <span>Mystique</span>
                    <span>9.5</span>
                </div>

                <div class="bar">
                    <div class="bar-fill" style="width:95%"></div>
                </div>
            </div>

            <div class="stat">
                <div class="label">
                    <span>Elegance</span>
                    <span>9.8</span>
                </div>

                <div class="bar">
                    <div class="bar-fill" style="width:98%"></div>
                </div>
            </div>

            <div class="stat">
                <div class="label">
                    <span>Signature</span>
                    <span>9.6</span>
                </div>

                <div class="bar">
                    <div class="bar-fill" style="width:96%"></div>
                </div>
            </div>

        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        Imperial Code — Maison Oudora
        <br><br>
        “Not a fragrance. A coded presence.”
    </div>

</div>

</body>
</html>
